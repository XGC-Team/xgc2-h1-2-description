schema: xgc2.product.v1
id: xgc2-ros-jazzy-h1-2-description
name: XGC2 Unitree H1-2 Description for ROS Jazzy
version: 0.1.0-1
kind: ros2-apt
summary: ROS Jazzy visual description assets for Unitree H1-2.
groups:
- ros2
- robot
- description
ros:
  distro: jazzy
  packages:
  - h1_2_description
apt:
  distribution: noble
  install:
  - ros-jazzy-xgc2-h1-2-description
  packages:
  - ros-jazzy-xgc2-h1-2-description
  package_architectures:
    ros-jazzy-xgc2-h1-2-description:
    - amd64
    - arm64
  depends:
  - ros-jazzy-urdf
usage:
  install: |
    sudo apt update
    sudo apt install ros-jazzy-xgc2-h1-2-description
  smoke_test: |
    ros2 pkg prefix h1_2_description
    test -f /opt/ros/jazzy/share/h1_2_description/urdf/h1_2_visual.urdf
ownership:
  paths:
  - /opt/ros/jazzy/share/h1_2_description
  - /opt/ros/jazzy/share/ament_index/resource_index/packages/h1_2_description
  - /opt/ros/jazzy/share/ament_index/resource_index/package_run_dependencies/h1_2_description
  - /opt/ros/jazzy/share/ament_index/resource_index/parent_prefix_path/h1_2_description
release:
  repository: XGC-Team/xgc2-h1-2-description
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    noble: 0.1.0-1
